<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8731E">
<title>TMFB Başvuru Hazırlayıcı</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TMFB Başvuru">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --bg:#E8ECEF;--panel:#FFFFFF;--ink:#17222D;--muted:#5A6875;--rule:#C9D1D8;--field:#F6F8F9;
  --accent:#E8731E;--accent-ink:#FFFFFF;--accent-soft:#FBE3D0;--ok:#2E7A57;--err:#B63A1B;
  --plate-line:#17222D;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Semi Condensed","Barlow",system-ui,"Arial Narrow",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171D;--panel:#18222B;--ink:#E4EAEF;--muted:#93A2AF;--rule:#2C3A46;--field:#121B22;
  --accent:#F08A3E;--accent-ink:#1A0E05;--accent-soft:#3A2414;--ok:#58B389;--err:#F07B5E;--plate-line:#10171D;
}}
:root[data-theme="dark"]{
  --bg:#10171D;--panel:#18222B;--ink:#E4EAEF;--muted:#93A2AF;--rule:#2C3A46;--field:#121B22;
  --accent:#F08A3E;--accent-ink:#1A0E05;--accent-soft:#3A2414;--ok:#58B389;--err:#F07B5E;--plate-line:#10171D;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
.top{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--rule);background:var(--panel)}
.plate{flex:none;width:58px;height:40px;background:var(--accent);border:3px solid var(--plate-line);border-radius:3px;display:grid;grid-template-rows:1fr 1fr;font:700 11px/1 var(--cond);color:#17222D;text-align:center;letter-spacing:.02em}
.plate span{display:flex;align-items:center;justify-content:center}
.plate span+span{border-top:2px solid var(--plate-line)}
.top h1{margin:0;font:600 21px/1.15 var(--cond)}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.top .grow{flex:1;min-width:0}
.saved{font-size:13px;color:var(--muted);white-space:nowrap}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;max-width:1320px;margin:0 auto}
nav.steps{padding:24px 16px;position:sticky;top:0;align-self:start}
nav.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
nav.steps button{width:100%;display:flex;gap:12px;align-items:center;padding:9px 10px;border:0;background:none;border-radius:6px;text-align:left;cursor:pointer;color:var(--muted)}
nav.steps button:hover{background:var(--panel);color:var(--ink)}
nav.steps .n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font:600 13px/1 var(--cond)}
nav.steps .t{font-weight:500;line-height:1.25}
nav.steps .t small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
nav.steps li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
nav.steps li.part .n{border-color:var(--ok);color:var(--ok)}
nav.steps li.cur button{background:var(--panel);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
nav.steps li.cur .n{border-color:var(--accent);color:var(--accent)}
nav.steps li.cur.done .n{color:#fff}

main{padding:24px 24px 64px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:28px 32px;max-width:920px}
.panel.wide{max-width:none}
.panel>h2{margin:0 0 4px;font:600 28px/1.15 var(--cond)}
.panel>.lead{margin:0 0 24px;color:var(--muted);max-width:68ch}
h3{font:600 18px/1.2 var(--cond);margin:28px 0 12px}
h3:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 16px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:1/-1}.c1{grid-column:span 1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:500}
label.f .opt{font-weight:400;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--rule);background:var(--field);border-radius:5px;padding:8px 10px;font-weight:400;font-size:15px;min-height:40px}
.f textarea{min-height:96px;resize:vertical;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-weight:400;font-size:13px;color:var(--muted)}
.err{display:none;font-weight:400;font-size:13px;color:var(--err)}
input[aria-invalid="true"]{border-color:var(--err)!important}
input[aria-invalid="true"]~.err{display:block}

/* choice chips / segmented */
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-size:14px;font-weight:500;padding:0;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--rule);border-radius:999px;font-size:14px;background:var(--field);cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chip.sq span{border-radius:5px}

/* repeating cards */
.card{border:1px solid var(--rule);border-radius:7px;padding:18px 18px 16px;margin-bottom:14px;background:var(--panel)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h .idx{font:600 15px/1 var(--cond);color:var(--muted)}
.card-h .ttl{font:600 17px/1.2 var(--cond);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:14px}
.qty label.f input{text-align:right;font-variant-numeric:tabular-nums}
details.sub{margin-top:14px;border-top:1px dashed var(--rule);padding-top:10px}
details.sub summary{cursor:pointer;font-weight:500;font-size:15px;padding:4px 0}
details.sub summary .hint{margin-left:6px}
.subgrid{display:grid;gap:12px;padding:10px 0 4px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:8px 14px;font-weight:500;font-size:15px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 8px;min-height:32px;font-size:14px}
.btn.ghost:hover{color:var(--ink);border-color:var(--rule)}
.btn.danger:hover{color:var(--err)}
.btn.warn{border-color:var(--err);color:var(--err)}
.add{width:100%;justify-content:center;border-style:dashed;color:var(--muted)}
.add:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--rule)}

.totals{display:grid;grid-template-columns:auto repeat(6,minmax(0,1fr));gap:4px 12px;align-items:baseline;border:1px solid var(--rule);border-radius:7px;padding:12px 16px;margin:6px 0 18px;background:var(--field);font-size:14px}
.totals b{display:block;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.totals .lb{color:var(--muted);text-align:right;font-size:12.5px}
.totals .h{font:600 15px var(--cond)}

.q{padding:14px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:center}
.q p{margin:0}
.q .note{grid-column:1/-1;font-size:13px;color:var(--muted)}
.q .extra{grid-column:1/-1}
.q:last-of-type{border-bottom:0}

.fk{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.status{font-size:13px;color:var(--muted)}

.empty{border:1px dashed var(--rule);border-radius:7px;padding:28px;text-align:center;color:var(--muted);margin-bottom:14px}

/* preview */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.toolbar .sep{flex:1}
.missing{margin:14px 0 18px;padding:12px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:14px}
.missing ul{margin:6px 0 0;padding-left:18px}
.missing button{border:0;background:none;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:14px}
.docs{overflow-x:auto;padding:8px 0 24px;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--bg);border-radius:6px}
.docs .page{box-shadow:0 1px 3px rgba(20,30,40,.18),0 8px 24px rgba(20,30,40,.10)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:6px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:10;max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0}
.toast[hidden]{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.steps{min-width:0}
  nav.steps{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 12px;border-bottom:1px solid var(--rule);top:env(safe-area-inset-top,0px)}
  nav.steps ol{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  nav.steps button{white-space:nowrap;padding:6px 10px}
  nav.steps .t small{display:none}
  nav.steps li.cur button{box-shadow:inset 0 -3px 0 var(--accent)}
  main{padding:16px 12px 56px}
  .panel{padding:20px 16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c1,.c2{grid-column:span 1}.c3,.c4{grid-column:1/-1}
  .qty{grid-template-columns:repeat(3,minmax(0,1fr))}
  .totals{grid-template-columns:repeat(3,minmax(0,1fr))}
  .totals .h{grid-column:1/-1}
  .top{padding:12px 14px}
  .top p,.saved{display:none}
}
</style>

<style id="doc-css">
/* ---- printed documents ---- */
.page{width:210mm;min-height:297mm;background:#fff;color:#000;padding:12mm 13mm 10mm;font:9.5pt/1.35 Arial,"Liberation Sans",Helvetica,sans-serif;display:flex;flex-direction:column;page:port;flex:none}
.page.land{width:297mm;min-height:210mm;padding:9mm 10mm 8mm;page:land}

.page .opt{display:inline-block;margin-right:5mm;white-space:nowrap}
.page .dtitle{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:11.5pt;margin-bottom:4mm}
.page .dtitle .c{flex:1;text-align:center}

.page .kv td:first-child{width:62mm;font-weight:700}
.page .sec{font-weight:700;margin:4mm 0 2mm}
.page .para{font-size:8.8pt;line-height:1.45}
.page .hd td{height:7mm}
.page .shade{background:#EDEDED;font-weight:700}
.printfile{background:#DDD;margin:0;display:flex;flex-direction:column;align-items:center;gap:10mm;padding:10mm 0}
.printfile .pbtn{position:fixed;top:12px;right:12px;padding:10px 18px;font:600 15px Arial;background:#E8731E;color:#fff;border:0;border-radius:6px;cursor:pointer}
@page port{size:A4 portrait;margin:0}
@page land{size:A4 landscape;margin:0}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important}
  :root{padding:0!important}
  .top,nav.steps,.toast,.panel>*:not(#docs){display:none!important}
  .shell,main,.panel{display:block!important;padding:0!important;margin:0!important;border:0!important;max-width:none!important;background:none!important;box-shadow:none!important}

  .printfile .pbtn{display:none}

}
</style>

<body>
<header class="top">
  <div class="plate" aria-hidden="true"><span>TMFB</span><span>EK 1–3</span></div>
  <div class="grow">
    <h1>TMFB Başvuru Hazırlayıcı</h1>
    <p>Tehlikeli Madde Faaliyet Belgesi dilekçe, başvuru formu ve faaliyet tespit raporu</p>
  </div>
  <div class="saved" id="saved" aria-live="polite"></div>
</header>

<div class="shell">
  <nav class="steps" aria-label="Adımlar"><ol id="nav"></ol></nav>
  <main><div id="form"></div></main>
</div>
<input type="file" id="loadfile" accept=".json,application/json" class="vh" tabindex="-1" aria-hidden="true">
<div class="toast" id="toast" role="status" hidden><span id="toastmsg"></span><button id="toastbtn" hidden></button></div>

<script>
(function(){

const KEY='tmfb-taslak-v1';

const Q=[
 {k:'q5',n:5,t:'İşletme, tehlikeli madde taşımacılığı zincirinde "Taşımacı" faaliyetinde bulunuyor mu?',star:'evet'},

];
const STEPS=[

];

const newMadde=()=>({un:'',sinif:'',pg:'',kat:'',oh:'',ad:'',alici:'',bosaltan:'',gonderen:'',dolduran:'',yukleyen:'',paketleyen:'',gelis:{sekil:[],islem:'',tasima:[]},gonderim:{sekil:[],islem:'',tasima:[]}});
const newYetkili=()=>({ad:'',gorev:'',tc:'',iletisim:'',dogum:''});
const newMuaf=()=>({un:'',sinif:'',kat:'',g33:'',g34:'',g35:'',s33:'',s34:'',s35:''});
function blank(){return{
 v:1,
 basvuru:{islem:'',birim:'',tasimaciTip:'',bolge:'I. BÖLGE MÜDÜRLÜĞÜNE',tarih:today(),raporTarihi:today(),talepAdresi:''},

function merge(base,src){ // keep shape of base, fill from src
 if(Array.isArray(base))return Array.isArray(src)?src:base;
 if(base&&typeof base==='object'){const o={};for(const k in base)o[k]=merge(base[k],src?src[k]:undefined);return o}
 return src===undefined||src===null?base:src;
}
function normalize(s){
 const b=merge(blank(),s);
 b.maddeler=(b.maddeler||[]).map(m=>merge(newMadde(),m));
 b.yetkililer=(b.yetkililer&&b.yetkililer.length?b.yetkililer:[newYetkili()]).map(y=>merge(newYetkili(),y));
 b.muafiyet.rows=(b.muafiyet.rows||[]).map(r=>merge(newMuaf(),r));
 return b;
}

try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);S=normalize(o.data);step=Math.min(o.step||0,STEPS.length-1)}}catch(e){}

const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function setP(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++)a=a[ks[i]];a[ks[ks.length-1]]=v}

function parseTR(v){
 v=String(v??'').replace(/\s/g,'');if(!v)return 0;
 if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');
 else if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');
 const n=parseFloat(v);return isFinite(n)?n:0;
}
const fmt=n=>n?n.toLocaleString('tr-TR',{maximumFractionDigits:3}):'';
const fmt0=n=>n.toLocaleString('tr-TR',{maximumFractionDigits:3});
const dDot=d=>{if(!d)return '';const[y,m,g]=d.split('-');return `${g}.${m}.${y}`};
const dSl=d=>{if(!d)return '';const[y,m,g]=d.split('-');return `${g}/${m}/${y}`};
function tcOk(t){if(!/^[1-9]\d{10}$/.test(t))return false;const d=[...t].map(Number);const o=d[0]+d[2]+d[4]+d[6]+d[8],e=d[1]+d[3]+d[5]+d[7];if(((o*7-e)%10+10)%10!==d[9])return false;return d.slice(0,10).reduce((a,b)=>a+b,0)%10===d[10]}

function totals(){const t={};FAAL.forEach(([k])=>t[k]=S.maddeler.reduce((a,m)=>a+parseTR(m[k]),0));return t}
function faaliyetAuto(){const t=totals(),s=[];KONU.forEach(([k])=>{if(t[k]>0)s.push(k)});if(S.sorular.q5==='evet')s.push('tasimaci');if(S.sorular.q6==='evet')s.push('tank');return s}

const hasGonderim=m=>m.gonderim.sekil.length||m.gonderim.islem||m.gonderim.tasima.length;

/* ---------- completion ---------- */
function stepState(i){
 const b=S.basvuru,is=S.isletme,y=y0(),t=S.tmgdk;let need=[];
 switch(STEPS[i][0]){
  case 'basvuru':need=[b.islem,b.birim,b.tarih,b.raporTarihi,b.bolge];break;
  case 'isletme':need=[is.unvan,is.vd,is.vno,is.adres,is.gsm,is.istigal.length];break;
  case 'yetkili':need=[y.ad,y.gorev,y.tc,y.iletisim];break;
  case 'tmgdk':need=[t.unvan,t.belgeNo,t.yetkiliAd,t.tmgdAd,t.tmgdTc];break;
  case 'madde':need=[S.maddeler.length,S.maddeler.every(m=>m.un&&m.ad)];break;
  case 'muaf':need=[S.muafiyet.durum,S.muafiyet.durum!=='var'||S.muafiyet.rows.length];break;
  case 'soru':need=Q.map(q=>S.sorular[q.k]);break;
  case 'belge':return '';
 }
 const f=need.filter(Boolean).length;return f===need.length?'done':f?'part':'';
}
function missingList(){
 const out=[];const b=S.basvuru,is=S.isletme,y=y0(),t=S.tmgdk;
 const chk=(v,msg,s)=>{if(!v)out.push([msg,s])};
 chk(b.islem,'İşlem türü seçilmedi',0);chk(b.birim,'Merkez / şube seçilmedi',0);
 chk(is.unvan,'İşletme ünvanı boş',1);chk(is.vno,'Vergi numarası boş',1);chk(is.adres,'İşletme adresi boş',1);chk(is.istigal.length,'İştigal türü seçilmedi',1);
 chk(y.ad,'Yetkili adı soyadı boş',2);chk(y.tc,'Yetkili T.C. kimlik no boş',2);
 if(y.tc&&!tcOk(y.tc))out.push(['Yetkili T.C. kimlik no geçersiz görünüyor',2]);
 chk(t.unvan,'TMGDK ünvanı boş',3);chk(t.tmgdAd,'Raporu hazırlayan TMGD boş',3);
 chk(S.maddeler.length,'Hiç tehlikeli madde eklenmedi',4);
 S.maddeler.forEach((m,i)=>{if(!m.un)out.push([`${i+1}. maddenin UN numarası boş`,4])});
 chk(S.muafiyet.durum,'ADR muafiyeti için VAR / YOK seçilmedi',5);
 const qm=Q.filter(q=>!S.sorular[q.k]).map(q=>q.n);if(qm.length)out.push([`Cevaplanmayan sorular: ${qm.join(', ')}`,6]);
 return out;
}

function F(p,label,o={}){
 const v=getP(S,p)??'';const id='f_'+p.replace(/\./g,'_');const cls=o.c!==undefined?o.c:'c3';
 let inp;

 return `<label class="f ${cls}" for="${id}"><span>${esc(label)}${o.opt?' <span class="opt">(isteğe bağlı)</span>':''}</span>${inp}${o.tc!==undefined?'<span class="err">11 haneli geçerli bir T.C. kimlik numarası girin.</span>':''}${o.hint?`<span class="hint">${o.hint}</span>`:''}</label>`;
}

 return `<section class="page"><table class="g sm">
${Q.map(row).join('')}
<tr><td class="xs">ᵃ İşlem yapılan tehlikeli madde miktarına bakılmaksızın, iştigal ettikleri faaliyet konularına bağlı olarak TMFB almak zorunda olduğundan bu belgede düzenlenen 1, 2, 3 ve 4 üncü maddelerdeki tabloların yapılan faaliyetlere uygun olarak doldurulması zorunludur.<br>11. madde: * İlk defa TMFB başvurularında bu madde işaretlenmeyecektir. ** Devredilmiş faaliyet konularını açıklama kısmında belirtiniz.<br>12. madde: * Yönetmeliğin 8 inci maddesinin ilgili madde ve bentleri referans gösterilerek detaylı olarak açıklamasını açıklama kısmında yapınız.</td></tr>
<tr><td style="height:70mm;vertical-align:top"><b>AÇIKLAMA:</b><br>${nl(S.aciklama)}</td></tr>
</table>
<div class="fill"></div>
<div class="sm" style="margin-top:3mm">${konuGrid()}</div>
${sig3()}${footRapor()}</section>`}
const docs=()=>ek1()+ek2()+ek3()+syf1()+syf2()+syf3();

/* ---------- render ---------- */
function renderNav(){
 $('#nav').innerHTML=STEPS.map(([k,t,sub],i)=>{const st=stepState(i);return `<li class="${i===step?'cur':''} ${st}"><button data-act="go" data-s="${i}" ${i===step?'aria-current="step"':''}><span class="n">${st==='done'?'✓':i+1}</span><span class="t">${t}<small>${sub}</small></span></button></li>`}).join('');
}
function renderStep(keepScroll){
 const k=STEPS[step][0];
 $('#form').innerHTML=`<div class="panel ${k==='belge'?'wide':''}">${V[k]()}
 <div class="pager">${step>0?`<button class="btn" data-act="prev">Geri: ${STEPS[step-1][1]}</button>`:'<span></span>'}${step<STEPS.length-1?`<button class="btn pri" data-act="next">İleri: ${STEPS[step+1][1]}</button>`:''}</div></div>`;
 renderNav();
 if(k==='belge')fitDocs();
 if(!keepScroll)window.scrollTo(0,0);
}
function fitDocs(){const box=$('#docs');if(!box)return;const w=box.clientWidth-16;const mm=3.7795;
 box.querySelectorAll('.page').forEach(p=>{const pw=(p.classList.contains('land')?297:210)*mm;p.style.zoom=Math.min(1,w/pw)})}
window.addEventListener('resize',()=>{if(STEPS[step][0]==='belge')fitDocs()});

let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({step,data:S}));const d=new Date();$('#saved').textContent=`Taslak bu cihazda kaydedildi, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}catch(e){$('#saved').textContent='Taslak bu tarayıcıda saklanamıyor'}},300)}
function liveUpdate(el){
 if(STEPS[step][0]==='madde'){const t=totals();document.querySelectorAll('[data-total]').forEach(b=>b.textContent=fmt0(t[b.dataset.total]));
  const m=el.dataset.p&&el.dataset.p.match(/^maddeler\.(\d+)\.(un|ad)$/);if(m){const s=document.querySelector(`[data-mt="${m[1]}"]`);if(s)s.textContent=mTitle(S.maddeler[+m[1]])}}
 renderNav();
}

/* ---------- events ---------- */
const form=$('#form');
form.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.fk!==undefined){const cur=faaliyetSel().slice();const k=el.dataset.fk;const i=cur.indexOf(k);if(el.checked&&i<0)cur.push(k);if(!el.checked&&i>=0)cur.splice(i,1);S.faaliyet={manual:true,sel:cur};save();
  $('#fkstatus').innerHTML='Elle düzenlendi. <button class="btn ghost" data-act="fk-reset">Miktarlara göre yeniden hesapla</button>';return}
 const p=el.dataset.p;if(!p)return;
 if(el.type==='checkbox'){const arr=getP(S,p);const v=el.dataset.v;const i=arr.indexOf(v);if(el.checked&&i<0)arr.push(v);if(!el.checked&&i>=0)arr.splice(i,1);
  if(p==='isletme.istigal'&&v==='DİĞER'){save();renderStep(true);return}}
 else if(el.type==='radio'){setP(S,p,el.value);if(el.dataset.rr!==undefined){save();renderStep(true);return}}
 else{let v=el.value;if(el.dataset.tc!==undefined){v=v.replace(/\D/g,'').slice(0,11);if(v!==el.value)el.value=v;el.setAttribute('aria-invalid',v.length===11&&!tcOk(v)?'true':'false')}setP(S,p,v)}
 save();liveUpdate(el);
});
form.addEventListener('focusout',e=>{const el=e.target;if(el.dataset&&el.dataset.tc!==undefined)el.setAttribute('aria-invalid',el.value&&!tcOk(el.value)?'true':'false')});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
 switch(a){
  case 'go':step=+b.dataset.s;save();renderStep();break;
  case 'next':step=Math.min(step+1,STEPS.length-1);save();renderStep();break;
  case 'prev':step=Math.max(step-1,0);save();renderStep();break;
  case 'add-yetkili':S.yetkililer.push(newYetkili());save();renderStep(true);break;
  case 'del-yetkili':remove('yetkililer',i,'Yetkili silindi');break;
  case 'add-madde':S.maddeler.push(newMadde());save();renderStep(true);{const c=document.getElementById('m'+(S.maddeler.length-1));if(c){c.scrollIntoView({block:'center'});c.querySelector('input')?.focus()}}break;
  case 'dup-madde':S.maddeler.splice(i+1,0,JSON.parse(JSON.stringify(S.maddeler[i])));save();renderStep(true);toast('Madde kopyalandı');break;
  case 'del-madde':remove('maddeler',i,'Madde silindi');break;
  case 'add-muaf':S.muafiyet.rows.push(newMuaf());save();renderStep(true);break;
  case 'del-muaf':remove('muafiyet.rows',i,'Satır silindi');break;
  case 'fk-reset':S.faaliyet={manual:false,sel:[]};save();renderStep(true);break;
  case 'print':try{window.print()}catch(err){toast('Yazdırma bu görünümde açılamadı. "Yazdırılabilir dosyayı indir" ile deneyin.')}break;
  case 'dl-print':saveFile(fname('html'),printable(),'text/html');break;
  case 'save-json':saveFile(fname('json'),JSON.stringify({app:'tmfb-basvuru',v:1,kayit:new Date().toISOString(),data:S},null,1),'application/json');break;
  case 'load-json':$('#loadfile').click();break;
  case 'reset':if(b.dataset.armed){const old=JSON.stringify(S);S=blank();step=0;save();renderStep();toast('Yeni boş başvuru açıldı',{label:'Geri al',fn:()=>{S=normalize(JSON.parse(old));step=STEPS.length-1;save();renderStep()}})}
   else{b.dataset.armed='1';b.textContent='Tüm bilgiler silinecek. Onaylamak için tekrar tıklayın';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Yeni başvuru'}},4000)}break;
 }
});
function remove(path,i,msg){const arr=getP(S,path);const item=arr.splice(i,1)[0];save();renderStep(true);toast(msg,{label:'Geri al',fn:()=>{getP(S,path).splice(i,0,item);save();renderStep(true)}})}
$('#loadfile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const o=JSON.parse(await f.text());if(!o||!o.data||o.app!=='tmfb-basvuru')throw new Error('x');S=normalize(o.data);step=0;save();renderStep();toast('Taslak açıldı')}catch(err){toast('Bu dosya bir TMFB taslak dosyası değil. Uygulamadan kaydedilen .json dosyasını seçin.')}});

let toastT;
function toast(msg,action){const t=$('#toast'),btn=$('#toastbtn');$('#toastmsg').textContent=msg;
 if(action){btn.hidden=false;btn.textContent=action.label;btn.onclick=()=>{t.hidden=true;action.fn()}}else btn.hidden=true;
 t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,action?6500:3500)}

function fname(ext){const tr={'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','Ç':'C','Ğ':'G','İ':'I','Ö':'O','Ş':'S','Ü':'U'};
 const u=(S.isletme.unvan||'isletme').replace(/[çğıöşüÇĞİÖŞÜ]/g,c=>tr[c]).replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);
 return `TMFB_${u}_${S.basvuru.raporTarihi||today()}.${ext}`}
function printable(){return `<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(fname('html').replace('.html',''))}</title><style>${$('#doc-css').textContent}</style></head><body class="printfile"><button class="pbtn" onclick="window.print()">Yazdır / PDF</button>${docs()}</body></html>`}
async function saveFile(name,data,mime){
 let d=null;try{if(window.claude&&typeof window.claude.use==='function')d=await window.claude.use('downloads')}catch(e){}
 if(d){try{await d.save({filename:name,data});toast('Dosya kaydedildi')}catch(err){if(err&&err.code==='declined')return;if(err&&err.code==='rate_limited'){toast('Bir kaydetme penceresi zaten açık.');return}toast('Dosya kaydedilemedi.')}return}
 try{const url=URL.createObjectURL(new Blob([data],{type:mime+';charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){toast('Dosya bu görünümde indirilemiyor.')}
}
window.addEventListener('beforeprint',()=>{if(STEPS[step][0]!=='belge'){step=STEPS.length-1;renderStep()}document.querySelectorAll('#docs .page').forEach(p=>p.dataset.z=p.style.zoom)});
window.addEventListener('afterprint',fitDocs);

renderStep();
})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
